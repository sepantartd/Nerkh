name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          cd client
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist
      - uses: actions/deploy-pages@v4
      
